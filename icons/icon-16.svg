<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5f97"/>
      <stop offset="1" stop-color="#ff9a52"/>
    </linearGradient>
  </defs>
  <!-- 16px 简化版：去掉头像圆点，只留标签和两条列表线 -->
  <rect width="16" height="16" rx="4" fill="url(#bg)"/>
  <rect x="3" y="3" width="6" height="3" rx="1.5" fill="#fff"/>
  <rect x="10" y="3" width="3" height="3" rx="1.5" fill="#fff" fill-opacity=".5"/>
  <rect x="3" y="8" width="10" height="2" rx="1" fill="#fff"/>
  <rect x="3" y="11.5" width="7" height="2" rx="1" fill="#fff" fill-opacity=".65"/>
</svg>
